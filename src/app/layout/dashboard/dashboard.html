<div class="dashboard-wrapper">
  <div class="logo-header">
    <div style="font-size: 24px; font-weight: bold; display: flex; align-items: center;">
      <button class="menu-toggle-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar" title="Toggle sidebar">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span style="margin-right: 20px;"> Sojar Research QMS Portal</span>
    </div>
    <a class="header-logout" routerLink="/login" aria-label="Logout" title="Logout">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Logout</span>
    </a>
  </div>
  <div class="dashboard-body">
    <app-sidebar [isCollapsed]="sidebarCollapsed"></app-sidebar>
    <div class="dashboard-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
