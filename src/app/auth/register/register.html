<div class="split-layout">
  <div class="split-image-container"></div>
  <div class="split-form-container">
    <div class="auth-form" style="max-width: 500px;">
      <h2>Organization Registration</h2>
      <div class="form-group">
        <label>Name</label>
        <input type="text" placeholder="Organization Name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Contact Email" />
      </div>
      <div class="form-group">
        <label>Organization URL</label>
        <input type="text" placeholder="https://" />
      </div>
      <button class="btn-primary" style="width: 100%; margin-top: 10px;" routerLink="/dashboard">Save</button>
      <div style="margin-top: 20px; text-align: center;">
        <a routerLink="/login">Cancel</a>
      </div>
    </div>
  </div>
</div>
