<div class="split-layout">
  <div class="split-image-container"></div>
  <div class="split-form-container">
    <div class="auth-form">
      <h2>Yo! Forgot Your Password?</h2>
      <p>No worries! Enter your email and we will send you a link to reset.</p>
      <div class="form-group" style="position: relative;">
        <i class="fa-solid fa-envelope" style="position: absolute; left: 10px; top: 35px; color: #888;"></i>
        <label>Email</label>
        <input type="email" placeholder="Email Address" style="padding-left: 30px;" />
      </div>
      <button class="btn-primary" style="width: 100%; margin-top: 10px;">Send</button>
      <div style="margin-top: 20px; text-align: center;">
        <a routerLink="/login">Back to Login</a>
      </div>
    </div>
  </div>
</div>
