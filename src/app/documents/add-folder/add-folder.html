<main class="add-folder-page">
  <section class="folder-card">
    <header class="dialog-header"><h2>{{ isEditing ? 'Edit Folder' : 'Add Folder' }}</h2><button class="close-button" type="button" (click)="cancel()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></header>
    <form class="folder-form" (submit)="$event.preventDefault(); save()">
      <label>Folder Name<input type="text" [(ngModel)]="folderName" name="folderName"></label>
      <label>Folder Code<input type="text" [(ngModel)]="folderCode" name="folderCode"></label>
      <div class="form-field document-type-field">
        <span class="field-label">Document Types</span>
        <button type="button" class="document-type-summary" (click)="toggleDocumentTypes()" [attr.aria-expanded]="documentTypeExpanded"><span>{{ documentTypeSummary() }}</span><i class="fa-solid" [ngClass]="documentTypeExpanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i></button>
        <div class="document-type-list" *ngIf="documentTypeExpanded"><label class="document-type-option" *ngFor="let option of documentTypeOptions"><input type="checkbox" [checked]="documentTypes.includes(option)" (change)="toggleDocumentType(option)"><span>{{ option }}</span></label></div>
      </div>
      <label>Groups<select [(ngModel)]="group" name="group"><option *ngFor="let option of groupOptions" [ngValue]="option">{{ option }}</option></select></label>
      <div class="toggle-field"><span>Override Document No. format at folder</span><mat-slide-toggle [(ngModel)]="overrideDocumentNumber" name="overrideDocumentNumber" aria-label="Override document number format at folder"></mat-slide-toggle></div>
      <div class="toggle-field"><span>Allow To Input Document No. Manually?</span><mat-slide-toggle [(ngModel)]="manualDocumentNumber" name="manualDocumentNumber" aria-label="Allow document number input manually"></mat-slide-toggle></div>
      <div class="toggle-field"><span>Allow To Input Version Manually?</span><mat-slide-toggle [(ngModel)]="manualVersion" name="manualVersion" aria-label="Allow version input manually"></mat-slide-toggle></div>
      <div class="toggle-field"><span>Cascade Privilege To Child Folders</span><mat-slide-toggle [(ngModel)]="cascadePrivilege" name="cascadePrivilege" aria-label="Cascade privilege to child folders"></mat-slide-toggle></div>
      <label class="full-width">Folder Designation<textarea rows="3" [(ngModel)]="folderDesignation" name="folderDesignation"></textarea></label>
      <div class="dialog-actions"><button type="button" class="btn-secondary" (click)="cancel()">Cancel</button><button type="submit" class="btn-primary">{{ isEditing ? 'Update' : 'Save' }}</button></div>
    </form>
  </section>
</main>
